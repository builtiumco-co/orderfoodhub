<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Management - FoodHub Admin</title>
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="./css/admin-v2.css">
</head>

<body>

    <div class="app-shell">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-text">FoodHub Admin</div>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link">
                    <i data-lucide="layout-grid" class="nav-icon"></i>
                    Dashboard
                </a>
                <a href="orders.html" class="nav-link">
                    <i data-lucide="clipboard-list" class="nav-icon"></i>
                    Orders
                </a>
                <a href="menu.html" class="nav-link active">
                    <i data-lucide="utensils" class="nav-icon"></i>
                    Menu
                </a>
                <a href="categories.html" class="nav-link">
                    <i data-lucide="tags" class="nav-icon"></i>
                    Categories
                </a>
                <a href="settings.html" class="nav-link">
                    <i data-lucide="settings" class="nav-icon"></i>
                    Settings
                </a>
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <div class="main-wrapper">
            <header class="top-header">
                <div class="flex items-center">
                    <div class="menu-toggle" onclick="toggleSidebar()"><i data-lucide="menu"></i></div>
                    <h1 class="page-title">Menu Management</h1>
                </div>
                <button class="btn btn-primary" onclick="openModal()">
                    <i data-lucide="plus" size="16" style="margin-right:8px"></i> Add Item
                </button>
            </header>

            <div class="content-container">

                <!-- SEARCH BAR -->
                <div style="margin-bottom: 1.5rem;">
                    <div style="position: relative;">
                        <input type="text" id="menuSearch" placeholder="Search menu items..."
                            style="width: 100%; padding: 0.75rem 1rem 0.75rem 2.5rem; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.95rem;"
                            oninput="searchMenuItems(this.value)">
                        <i data-lucide="search" size="18"
                            style="position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: var(--gray);"></i>
                    </div>
                </div>

                <!-- MENU TABLE -->
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Item Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Availability</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="menuTableBody">
                            <!-- Content injected by menu-manager.js -->
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <!-- ADD ITEM MODAL -->
    <div class="modal-overlay" id="itemModal">
        <div class="modal-content">
            <div class="flex items-center justify-between" style="margin-bottom: 1.5rem;">
                <h3 class="page-title">Add Menu Item</h3>
                <button onclick="closeModal()"><i data-lucide="x"></i></button>
            </div>

            <form id="addItemForm">
                <div style="margin-bottom: 1rem;">
                    <label class="text-sm font-medium" style="display:block; margin-bottom:0.5rem">Item Name</label>
                    <input type="text" id="itemName" class="w-full"
                        style="padding:0.75rem; border:1px solid var(--border); border-radius:var(--radius);"
                        placeholder="e.g. Jollof Rice" required>
                </div>

                <div style="margin-bottom: 1rem;">
                    <label class="text-sm font-medium" style="display:block; margin-bottom:0.5rem">Image URL
                        (Optional)</label>
                    <input type="url" id="itemImageUrl" class="w-full"
                        style="padding:0.75rem; border:1px solid var(--border); border-radius:var(--radius);"
                        placeholder="https://example.com/image.jpg">
                    <p style="font-size: 0.75rem; color: #6b7280; margin-top: 0.25rem;">
                        💡 Recommended: 400x400px images for best display
                    </p>
                </div>

                <div style="margin-bottom: 1rem;">
                    <label class="text-sm font-medium" style="display:block; margin-bottom:0.5rem">Description
                        (Optional)</label>
                    <textarea id="itemDescription" class="w-full" rows="2"
                        style="padding:0.75rem; border:1px solid var(--border); border-radius:var(--radius);"
                        placeholder="Brief description of the item"></textarea>
                </div>

                <div class="flex gap-4" style="margin-bottom: 1rem;">
                    <div class="w-full">
                        <label class="text-sm font-medium" style="display:block; margin-bottom:0.5rem">Price (₦)</label>
                        <input type="number" id="itemPrice" class="w-full"
                            style="padding:0.75rem; border:1px solid var(--border); border-radius:var(--radius);"
                            placeholder="0" required>
                    </div>
                    <div class="w-full">
                        <label class="text-sm font-medium" style="display:block; margin-bottom:0.5rem">Category</label>
                        <select id="itemCategory" class="w-full"
                            style="padding:0.75rem; border:1px solid var(--border); border-radius:var(--radius);">
                            <!-- Populated by JS -->
                        </select>
                    </div>
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label class="text-sm font-medium" style="display:block; margin-bottom:0.5rem">Availability</label>
                    <label class="switch">
                        <input type="checkbox" id="itemAvailable" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid var(--border);">

                <div style="margin-bottom: 1.5rem;">
                    <label class="text-sm font-medium" style="display:block; margin-bottom:0.25rem">Suggest with these categories</label>
                    <p style="font-size: 0.75rem; color: #6b7280; margin-bottom: 1rem;">
                        Show this item when customers add items from selected categories
                    </p>
                    <div id="suggestionCategoriesContainer" style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <!-- Populated dynamically by JS -->
                    </div>
                </div>

                <div class="flex justify-between">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                    <button type="submit" id="submitBtn" class="btn btn-primary">Save Item</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="./js/config.js"></script>
    <script src="./js/spa-router.js"></script>
    <script src="./js/admin-auth.js"></script>
    <script src="./js/menu-manager.js"></script>
    <script>
        lucide.createIcons();
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

        function openModal() {
            // Reset modal to Add mode
            document.querySelector('#itemModal h3').textContent = 'Add Menu Item';
            document.getElementById('submitBtn').textContent = 'Save Item';
            delete document.getElementById('addItemForm').dataset.editId;
            if (window.resetSuggestions) window.resetSuggestions();
            document.getElementById('itemModal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('itemModal').classList.remove('open');
            document.getElementById('addItemForm').reset();
            delete document.getElementById('addItemForm').dataset.editId;
        }
    </script>
</body>

</html>

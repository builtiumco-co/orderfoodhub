<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - FoodHub Admin</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="./css/admin-v2.css">
</head>

<body>

    <div class="app-shell">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-text">FoodHub Admin</div>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link"><i data-lucide="layout-grid"
                        class="nav-icon"></i>Dashboard</a>
                <a href="orders.html" class="nav-link"><i data-lucide="clipboard-list" class="nav-icon"></i>Orders</a>
                <a href="menu.html" class="nav-link"><i data-lucide="utensils" class="nav-icon"></i>Menu</a>
                <a href="categories.html" class="nav-link active"><i data-lucide="tags"
                        class="nav-icon"></i>Categories</a>
                <a href="settings.html" class="nav-link"><i data-lucide="settings" class="nav-icon"></i>Settings</a>
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <div class="main-wrapper">
            <header class="top-header">
                <div class="flex items-center">
                    <div class="menu-toggle" onclick="toggleSidebar()"><i data-lucide="menu"></i></div>
                    <h1 class="page-title">Categories</h1>
                </div>
                <button class="btn btn-primary" onclick="openModal()">
                    <i data-lucide="plus" size="16" style="margin-right:8px"></i> Add Category
                </button>
            </header>

            <div class="content-container">
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Category Name</th>
                                <th>Sort Order</th>
                                <th>Items Count</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="categoriesTableBody">
                            <!-- Content Injected -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- ADD MODAL -->
    <div class="modal-overlay" id="catModal">
        <div class="modal-content">
            <div class="flex items-center justify-between" style="margin-bottom: 1.5rem;">
                <h3 class="page-title">Add Category</h3>
                <button onclick="closeModal()"><i data-lucide="x"></i></button>
            </div>

            <form id="addCategoryForm">
                <div style="margin-bottom: 1rem;">
                    <label class="text-sm font-medium" style="display:block; margin-bottom:0.5rem">Category Name</label>
                    <input type="text" id="catName" class="w-full"
                        style="padding:0.75rem; border:1px solid var(--border); border-radius:var(--radius);"
                        placeholder="e.g. Soups" required>
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label class="text-sm font-medium" style="display:block; margin-bottom:0.5rem">Sort Order</label>
                    <input type="number" id="catSort" class="w-full"
                        style="padding:0.75rem; border:1px solid var(--border); border-radius:var(--radius);"
                        placeholder="1" value="1">
                    <div class="text-sm text-gray" style="margin-top:4px">Lower numbers appear first in the menu.</div>
                </div>
                <div class="flex justify-between">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                    <button type="submit" id="submitBtn" class="btn btn-primary">Save Category</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="./js/config.js"></script>
    <script src="./js/spa-router.js"></script>
    <script src="./js/admin-auth.js"></script>
    <script src="./js/categories-manager.js"></script>
    <script>
        lucide.createIcons();
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('items-open'); }
        function openModal() { document.getElementById('catModal').classList.add('open'); }
        function closeModal() { document.getElementById('catModal').classList.remove('open'); }
    </script>
</body>

</html>

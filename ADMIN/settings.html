<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - FoodHub Admin</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="./css/admin-v2.css">
</head>

<body>

    <div class="app-shell">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-text">FoodHub Admin</div>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link"><i data-lucide="layout-grid"
                        class="nav-icon"></i>Dashboard</a>
                <a href="orders.html" class="nav-link"><i data-lucide="clipboard-list" class="nav-icon"></i>Orders</a>
                <a href="menu.html" class="nav-link"><i data-lucide="utensils" class="nav-icon"></i>Menu</a>
                <a href="categories.html" class="nav-link"><i data-lucide="tags" class="nav-icon"></i>Categories</a>
                <a href="settings.html" class="nav-link active"><i data-lucide="settings"
                        class="nav-icon"></i>Settings</a>
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <div class="main-wrapper">
            <header class="top-header">
                <div class="flex items-center">
                    <div class="menu-toggle" onclick="toggleSidebar()"><i data-lucide="menu"></i></div>
                    <h1 class="page-title">Settings</h1>
                </div>
            </header>

            <div class="content-container">

                <div style="max-width: 800px;">

                    <!-- General Settings Section -->
                    <div class="card" style="margin-bottom: 2rem;">
                        <h2 style="margin-bottom: 1rem; font-size: 1.1rem;">Restaurant Profile</h2>
                        <form>
                            <div class="flex gap-4" style="margin-bottom: 1rem;">
                                <div class="w-full">
                                    <label class="text-sm font-medium"
                                        style="display:block; margin-bottom:0.5rem">Restaurant Name</label>
                                    <input type="text" class="w-full"
                                        style="padding:0.75rem; border:1px solid var(--border); border-radius:var(--radius);"
                                        value="The FoodHub" readonly>
                                </div>
                                <div class="w-full">
                                    <label class="text-sm font-medium"
                                        style="display:block; margin-bottom:0.5rem">WhatsApp Number</label>
                                    <input type="text" class="w-full"
                                        style="padding:0.75rem; border:1px solid var(--border); border-radius:var(--radius);"
                                        value="08123456789">
                                </div>
                            </div>
                            <button type="button" class="btn btn-primary">Save Changes</button>
                        </form>
                    </div>

                    <!-- Delivery Zones Section -->
                    <div class="card">
                        <div class="flex items-center justify-between" style="margin-bottom: 1rem;">
                            <h2 style="font-size: 1.1rem;">Delivery Zones & Pricing</h2>
                            <button class="btn btn-outline" onclick="openZoneModal()">+ Add Zone</button>
                        </div>

                        <div class="table-container">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Zone / Location</th>
                                        <th>Delivery Fee</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="zonesTableBody">
                                    <!-- JS Injected -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <!-- ADD ZONE MODAL -->
    <div class="modal-overlay" id="zoneModal">
        <div class="modal-content">
            <div class="flex items-center justify-between" style="margin-bottom: 1.5rem;">
                <h3 class="page-title">Add Delivery Zone</h3>
                <button onclick="closeModal()"><i data-lucide="x"></i></button>
            </div>

            <form id="addZoneForm">
                <div style="margin-bottom: 1rem;">
                    <label class="text-sm font-medium" style="display:block; margin-bottom:0.5rem">Zone Name</label>
                    <input type="text" id="zoneName" class="w-full"
                        style="padding:0.75rem; border:1px solid var(--border); border-radius:var(--radius);"
                        placeholder="e.g. Lekki Phase 1" required>
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label class="text-sm font-medium" style="display:block; margin-bottom:0.5rem">Delivery Price
                        (₦)</label>
                    <input type="number" id="zonePrice" class="w-full"
                        style="padding:0.75rem; border:1px solid var(--border); border-radius:var(--radius);"
                        placeholder="1500" required>
                </div>
                <div class="flex justify-between">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                    <button type="submit" id="saveZoneBtn" class="btn btn-primary">Save Zone</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="./js/config.js"></script>
    <script src="./js/spa-router.js"></script>
    <script src="./js/admin-auth.js"></script>
    <script src="./js/settings-manager.js"></script>
    <script>
        lucide.createIcons();
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('items-open'); }
        function openZoneModal() { document.getElementById('zoneModal').classList.add('open'); }
        function closeModal() { document.getElementById('zoneModal').classList.remove('open'); }
    </script>
</body>

</html>

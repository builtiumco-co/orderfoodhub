<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - FoodHub Admin</title>
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="./css/admin-v2.css">
</head>

<body>

    <div class="app-shell">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-text">FoodHub Admin</div>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link active">
                    <i data-lucide="layout-grid" class="nav-icon"></i>
                    Dashboard
                </a>
                <a href="orders.html" class="nav-link">
                    <i data-lucide="clipboard-list" class="nav-icon"></i>
                    Orders
                </a>
                <a href="menu.html" class="nav-link">
                    <i data-lucide="utensils" class="nav-icon"></i>
                    Menu
                </a>
                <a href="categories.html" class="nav-link">
                    <i data-lucide="tags" class="nav-icon"></i>
                    Categories
                </a>
                <a href="settings.html" class="nav-link">
                    <i data-lucide="settings" class="nav-icon"></i>
                    Settings
                </a>
            </nav>

            <div class="sidebar-user">
                <div class="user-avatar"></div>
                <div style="flex:1">
                    <div class="text-sm font-medium">Resturant Manager</div>
                    <div class="text-sm text-gray">Admin</div>
                </div>
                <button><i data-lucide="log-out" size="18" class="text-gray"></i></button>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <div class="main-wrapper">

            <!-- HEADER -->
            <header class="top-header">
                <div class="flex items-center">
                    <div class="menu-toggle" onclick="toggleSidebar()">
                        <i data-lucide="menu"></i>
                    </div>
                    <h1 class="page-title">Dashboard</h1>
                </div>
                <div class="flex items-center gap-4">
                    <div class="date-filter">
                        <input type="date" id="dashboardDatePicker" class="btn btn-outline"
                            style="padding: 0.4rem 0.8rem;">
                    </div>
                    <button id="exportDashboardCSV" class="btn btn-outline" style="font-size: 0.85rem;">
                        <i data-lucide="download" style="width:16px; height:16px; margin-right:4px;"></i> Export CSV
                    </button>
                    <button class="btn-icon"><i data-lucide="bell"></i></button>
                </div>
            </header>

            <!-- CONTENT -->
            <div class="content-container">

                <!-- STATS CARDS -->
                <!-- STATS CARDS -->
                <div class="stats-grid">
                    <div class="card stat-item">
                        <div>
                            <div class="stat-label">Orders</div>
                            <div class="stat-value" id="stat-orders">0</div>
                            <div class="text-xs text-gray mt-1" id="label-orders-date">Today</div>
                        </div>
                        <div class="stat-icon"><i data-lucide="shopping-bag"></i></div>
                    </div>
                    <div class="card stat-item">
                        <div>
                            <div class="stat-label">Revenue</div>
                            <div class="stat-value" id="stat-revenue">₦0</div>
                            <div class="text-xs text-gray mt-1" id="label-revenue-date">Today</div>
                        </div>
                        <div class="stat-icon" style="background: #ecfdf5; color: #10b981;"><i
                                data-lucide="dollar-sign"></i></div>
                    </div>
                    <div class="card stat-item">
                        <div>
                            <div class="stat-label">Pending</div>
                            <div class="stat-value" id="stat-pending">0</div>
                            <div class="text-xs text-gray mt-1" id="label-pending-date">Today</div>
                        </div>
                        <div class="stat-icon"><i data-lucide="clock"></i></div>
                    </div>
                    <div class="card stat-item">
                        <div>
                            <div class="stat-label">Completed</div>
                            <div class="stat-value" id="stat-completed">0</div>
                            <div class="text-xs text-gray mt-1" id="label-completed-date">Today</div>
                        </div>
                        <div class="stat-icon"><i data-lucide="check-circle"></i></div>
                    </div>
                </div>

                <!-- RECENT ORDERS TABLE -->
                <div class="flex items-center justify-between" style="margin-bottom: 1rem;">
                    <h2>Recent Orders</h2>
                    <a href="orders.html" class="text-sm font-medium" style="color:var(--primary)">View All</a>
                </div>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Status</th>
                                <th>Total</th>
                                <th>Time</th>
                            </tr>
                        </thead>
                        <tbody id="recentOrdersBody">
                            <!-- Content Injected -->
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="./js/config.js"></script>
    <script src="./js/spa-router.js"></script>
    <script src="./js/admin-auth.js"></script>
    <script src="./js/dashboard-home.js"></script>
    <script>
        lucide.createIcons();
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('items-open');
        }
    </script>
</body>

</html>

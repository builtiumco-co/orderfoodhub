<script>
    (function () {
        const sectionsContainer = document.getElementById('menu-sections');
        const headerCartCount = document.getElementById('header-cart-count');
        const cartFooter = document.getElementById('cart-footer');
        const footerItemCount = document.getElementById('footer-item-count');
        const footerCartTotal = document.getElementById('footer-cart-total');
        const backBtn = document.getElementById('menu-back-btn');
        const viewCartBtn = document.getElementById('view-cart-btn');
        const headerCartBtn = document.getElementById('header-cart-btn');
        const searchInput = document.getElementById('menu-search-input');

        let allCategories = [];

        // Emoji mapping based on common keywords
        const emojiMap = {
            'rice': '🍚',
            'jollof': '🥘',
            'chicken': '🍗',
            'soup': '🍲',
            'stew': '🥘',
            'egusi': '🍲',
            'fufu': '⚪',
            'garri': '🥣',
            'amala': '🤎',
            'water': '💧',
            'cola': '🥤',
            'fanta': '🥤',
            'zobo': '🍷',
            'juice': '🧃',
            'pizza': '🍕',
            'burger': '🍔'
        };

        function getEmoji(name) {
            const lower = name.toLowerCase();
            for (const [key, emoji] of Object.entries(emojiMap)) {
                if (lower.includes(key)) return emoji;
            }
            return '🍴'; // Default
        }

        async function initMenu() {
            console.log('🔄 Initializing Menu Screen...');
            try {
                const { data: menuData, error } = await menu.getAllMenuItems();
                if (error) throw error;

                if (!menuData || menuData.length === 0) {
                    sectionsContainer.innerHTML = '<div class="no-results"><span class="no-results-icon">🍽️</span><p class="no-results-text">No menu items available.</p></div>';
                    return;
                }

                allCategories = menuData;
                renderMenu(menuData);
                updateCartUI();
            } catch (err) {
                console.error('❌ Menu load error:', err);
                showToast('Failed to load menu. Please try again.', 'error');
            }
        }

        function renderMenu(categories) {
            if (categories.length === 0) {
                sectionsContainer.innerHTML = '<div class="no-results"><span class="no-results-icon">🔍</span><p class="no-results-text">No items match your search.</p></div>';
                return;
            }

            sectionsContainer.innerHTML = categories.map(cat => `
                <div class="category-section">
                    <div class="category-header">${cat.categoryName}</div>
                    <div class="items-list">
                        ${cat.items.map(item => `
                            <div class="menu-item" data-id="${item.id}">
                                <div class="item-image-container">
                                    ${item.image_url ?
                    `<img src="${item.image_url}" class="item-image" alt="${item.name}" onerror="this.parentElement.innerHTML='${getEmoji(item.name)}';">`
                    : getEmoji(item.name)
                }
                                </div>
                                <div class="item-info">
                                    <div class="item-name">${item.name}</div>
                                    <div class="item-desc">${item.description || "Tasty and fresh"}</div>
                                    <div class="item-price">${formatCurrency(item.price)}</div>
                                </div>
                                <button class="add-item-btn" data-item='${JSON.stringify(item).replace(/'/g, "&apos;")}'>
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            // Add events to All "Add" buttons
            sectionsContainer.querySelectorAll('.add-item-btn').forEach(btn => {
                btn.onclick = (e) => {
                    const item = JSON.parse(btn.getAttribute('data-item'));
                    addToCart(item);
                    updateCartUI();
                    showToast(`Added ${item.name} to cart`, 'success', 800);
                    showSuggestions(item);
                };
            });
        }

        function handleSearch(e) {
            const term = e.target.value.toLowerCase().trim();
            if (!term) {
                renderMenu(allCategories);
                return;
            }

            const filteredCategories = allCategories.map(cat => {
                const filteredItems = cat.items.filter(item =>
                    item.name.toLowerCase().includes(term) ||
                    (item.description && item.description.toLowerCase().includes(term))
                );
                return { ...cat, items: filteredItems };
            }).filter(cat => cat.items.length > 0);

            renderMenu(filteredCategories);
        }

        function updateCartUI() {
            const cart = getCart();
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            const total = getCartTotal();

            if (count > 0) {
                headerCartCount.textContent = count;
                headerCartCount.style.display = 'flex';
                cartFooter.style.display = 'block';
                footerItemCount.textContent = count;
                footerCartTotal.textContent = formatCurrency(total);
            } else {
                headerCartCount.style.display = 'none';
                cartFooter.style.display = 'none';
            }
        }

        let suggestionTimer = null;
        let suggestionProgressInterval = null;

        async function showSuggestions(item) {
            // Check if there are any suggestions for this item
            const { data: suggestions } = await window.menu.getItemSuggestions(item.id);
            if (!suggestions || suggestions.length === 0) return;

            // Group suggested categories and find items in allCategories
            const categoriesContainer = document.getElementById('suggestion-categories-container');
            categoriesContainer.innerHTML = '';
            let hasValidSuggestions = false;

            suggestions.forEach(sug => {
                const catInfo = sug.categories;
                if (!catInfo) return;

                // Find items for this category from our loaded allCategories
                const categoryGroup = allCategories.find(c => c.categoryId === catInfo.id);
                if (!categoryGroup || !categoryGroup.items || categoryGroup.items.length === 0) return;

                hasValidSuggestions = true;

                // Build HTML for category card
                const catCard = document.createElement('div');
                catCard.className = 'suggestion-cat-card';
                
                const header = document.createElement('div');
                header.className = 'suggestion-cat-header';
                header.innerHTML = `
                    <span>${catInfo.name}</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="chevron" style="transition: transform 0.2s;"><polyline points="6 9 12 15 18 9"></polyline></svg>
                `;

                const itemsList = document.createElement('div');
                itemsList.className = 'suggestion-items-list';
                
                // Add items
                categoryGroup.items.forEach(sugItem => {
                    const itemRow = document.createElement('div');
                    itemRow.className = 'sug-item';
                    itemRow.innerHTML = `
                        <div class="sug-item-info">
                            <span class="sug-item-name">${sugItem.name}</span>
                            <span class="sug-item-price">${formatCurrency(sugItem.price)}</span>
                        </div>
                        <button class="add-item-btn sug-add-btn" style="width:32px; height:32px; min-width:32px; border-radius:10px;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        </button>
                    `;
                    
                    // Add suggested item to cart
                    itemRow.querySelector('.sug-add-btn').onclick = (e) => {
                        e.stopPropagation();
                        addToCart(sugItem);
                        updateCartUI();
                        showToast(`Added ${sugItem.name}`, 'success', 800);
                        // Reset timer on activity
                        startSuggestionTimer();
                    };
                    itemsList.appendChild(itemRow);
                });

                // Toggle logic
                header.onclick = () => {
                    const isOpen = itemsList.classList.contains('open');
                    // Close others
                    document.querySelectorAll('.suggestion-items-list').forEach(list => list.classList.remove('open'));
                    document.querySelectorAll('.suggestion-cat-header .chevron').forEach(icon => icon.style.transform = 'rotate(0deg)');
                    
                    if (!isOpen) {
                        itemsList.classList.add('open');
                        header.querySelector('.chevron').style.transform = 'rotate(180deg)';
                    }
                    // Reset timer on activity
                    startSuggestionTimer();
                };

                catCard.appendChild(header);
                catCard.appendChild(itemsList);
                categoriesContainer.appendChild(catCard);
            });

            if (!hasValidSuggestions) return;

            document.getElementById('suggestion-title').textContent = `Perfect with ${item.name}?`;
            
            const overlay = document.getElementById('suggestion-modal-overlay');
            overlay.style.display = 'flex';
            // Trigger reflow for transition
            void overlay.offsetWidth;
            overlay.classList.add('show');

            startSuggestionTimer();
        }

        function closeSuggestionModal() {
            const overlay = document.getElementById('suggestion-modal-overlay');
            overlay.classList.remove('show');
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 300);
            
            clearInterval(suggestionProgressInterval);
            clearTimeout(suggestionTimer);
        }

        function startSuggestionTimer() {
            clearInterval(suggestionProgressInterval);
            clearTimeout(suggestionTimer);
            
            const progress = document.getElementById('suggestion-timer-progress');
            let timeLeft = 8000;
            const interval = 50; // Update every 50ms
            
            progress.style.transform = 'scaleX(1)';
            
            suggestionProgressInterval = setInterval(() => {
                timeLeft -= interval;
                if (timeLeft <= 0) {
                    clearInterval(suggestionProgressInterval);
                } else {
                    progress.style.transform = `scaleX(${timeLeft / 8000})`;
                }
            }, interval);

            suggestionTimer = setTimeout(() => {
                closeSuggestionModal();
            }, 8000);
        }

        const goToCart = () => router.goTo('cart');

        // Event Listeners
        backBtn.onclick = () => router.back();
        viewCartBtn.onclick = goToCart;
        headerCartBtn.onclick = goToCart;
        searchInput.oninput = handleSearch;
        document.getElementById('btn-dismiss-suggestion').onclick = closeSuggestionModal;

        // Initialize
        initMenu();

    })();
</script>
